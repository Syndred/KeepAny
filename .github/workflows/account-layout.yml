name: Account disclosure layout evidence
on:
  workflow_call:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  account-layout:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.10.0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - name: Verify recorded acceptance evidence and reviewed product identity
        run: node scripts/verify-account-acceptance.mjs
      - name: Verify route recovery and password history machine evidence
        run: node scripts/verify-route-history-evidence.mjs
      - run: node scripts/build-preview-release.mjs
        timeout-minutes: 10
      - name: Select the compiled commit explicitly
        run: node scripts/select-preview-candidate.mjs
        timeout-minutes: 1
      - run: pnpm verify:preview
        timeout-minutes: 5
      - run: pnpm test:final:layout
        timeout-minutes: 22
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: account-layout-machine-evidence
          path: test-results/account-layout-ci
          if-no-files-found: error
