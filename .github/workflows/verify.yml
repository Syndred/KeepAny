name: Verify local release

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17.11-alpine3.24
        env:
          POSTGRES_USER: keepany_test
          POSTGRES_PASSWORD: keepany_ci_test
          POSTGRES_DB: keepany_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U keepany_test -d keepany_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      KEEPANY_TEST_DATABASE_URL: postgresql://keepany_test:keepany_ci_test@127.0.0.1:5432/keepany_test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.10.0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Verify checked-in third-party license materials
        run: node scripts/phase0/verify-third-party-license-materials.mjs --release
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test
      - name: Verify intake refresh cannot overwrite concurrent edits
        run: pnpm exec playwright test tests/e2e/intake-refresh-race.spec.ts --workers=1 --reporter=dot
      - run: pnpm build
      - name: Verify committed web bundle
        run: node scripts/verify-local-release.mjs
      - name: Verify delivered files and offline backup flow
        run: pnpm exec playwright test --config playwright.release.config.ts --reporter=dot --trace=retain-on-failure
      - name: Verify delivered sync files with isolated PostgreSQL and local HTTP
        run: pnpm exec playwright test --config playwright.sync-release.config.ts --reporter=dot
      - name: Preserve failed browser evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: failed-browser-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}
          path: test-results/
          retention-days: 7
          if-no-files-found: ignore

  portable-workflows:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.10.0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - name: Build and verify the actual portable preview
        run: pnpm build:preview && pnpm verify:preview
      - name: Exercise local workflows on the extracted portable server
        shell: bash
        run: |
          archive="$(node --input-type=module -e 'import fs from "node:fs"; const files=fs.readdirSync("dist/preview").filter(name=>name.endsWith(".zip")); if(files.length!==1)throw Error("Expected one fresh preview"); process.stdout.write(`dist/preview/${files[0]}`);')"
          KEEPANY_PREVIEW_ARCHIVE="$archive" KEEPANY_RELEASE_TEST_PORT=4391 pnpm exec playwright test --config playwright.portable-release.config.ts --reporter=dot --trace=retain-on-failure
          KEEPANY_PREVIEW_ARCHIVE="$archive" KEEPANY_RELEASE_TEST_PORT=4391 pnpm exec playwright test --config playwright.portable-offline.config.ts --reporter=dot
      - name: Fetch published KeepAny upgrade baseline
        run: git fetch --no-tags --depth=1 origin 64b98e7874a2fdd8d43c8e60de72a25de5800b25
      - name: Verify KeepAny data and encrypted vault upgrade to StackPerch
        shell: bash
        run: |
          archive="$(node --input-type=module -e 'import fs from "node:fs"; const files=fs.readdirSync("dist/preview").filter(name=>name.endsWith(".zip")); if(files.length!==1)throw Error("Expected one fresh preview"); process.stdout.write(`dist/preview/${files[0]}`);')"
          KEEPANY_PREVIEW_ARCHIVE="$archive" pnpm exec playwright test --config playwright.brand-upgrade.config.ts --reporter=dot
      - name: Preserve failed browser evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: failed-browser-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}
          path: test-results/
          retention-days: 7
          if-no-files-found: ignore
