name: Verify local release

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.10.0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec vitest run apps/sync-server/src/bound-auth.test.ts packages/binding/src/bound-sync.test.ts
      - run: pnpm build
      - name: Verify committed web bundle
        run: diff -qr apps/web/dist release/web
