name: Publish KeepAny desktop preview 0.1.1

on:
  push:
    branches: [codex/desktop-release-0.1.1]
    paths:
      - '.github/workflows/publish-desktop-preview.yml'
      - 'scripts/prepare-desktop-preview-licenses.sh'
      - 'release/desktop-preview-0.1.1.md'

permissions:
  actions: read
  contents: read

concurrency:
  group: keepany-desktop-preview-0.1.1
  cancel-in-progress: false

env:
  KEEPANY_EXPECTED_COMMIT: d2da82c15f474f487b08a1362b3e141154a283d6
  KEEPANY_BUILD_RUN: '42374872785'
  KEEPANY_ACCEPTANCE_RUN: '42375685663'
  KEEPANY_ACCEPTANCE_COMMIT: e1d4b1d68751509754c613c3d87e680917394e70
  KEEPANY_TAG: v0.1.1-desktop-preview.20261107

jobs:
  prepare:
    if: github.repository == 'Syndred/KeepAny'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.KEEPANY_EXPECTED_COMMIT }}
          path: preview-source
          persist-credentials: false
      - name: Verify producing build and native acceptance
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [[ "$KEEPANY_BUILD_RUN" =~ ^[0-9]+$ ]]
          [[ "$KEEPANY_ACCEPTANCE_RUN" =~ ^[0-9]+$ ]]
          [[ "$KEEPANY_ACCEPTANCE_COMMIT" =~ ^[a-f0-9]{40}$ ]]
          build=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$KEEPANY_BUILD_RUN" --jq '[.head_sha,.head_branch,.path,.conclusion] | join("|")')
          test "$build" = "$KEEPANY_EXPECTED_COMMIT|main|.github/workflows/desktop.yml|success"
          acceptance=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$KEEPANY_ACCEPTANCE_RUN" --jq '[.head_sha,.path,.conclusion] | join("|")')
          test "$acceptance" = "$KEEPANY_ACCEPTANCE_COMMIT|.github/workflows/desktop-acceptance.yml|success"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$KEEPANY_ACCEPTANCE_RUN/jobs" \
            --jq '.jobs | map(select(.name | startswith("installed-window (")))' \
            | jq -e 'length == 3 and all(.[]; .conclusion == "success")'
          test "$(git -C preview-source rev-parse HEAD)" = "$KEEPANY_EXPECTED_COMMIT"
      - uses: actions/download-artifact@v4
        with:
          pattern: KeepAny-desktop-*
          github-token: ${{ github.token }}
          run-id: ${{ env.KEEPANY_BUILD_RUN }}
          path: candidates
      - name: Stage exactly the accepted binaries
        run: |
          mkdir -p release-assets
          for target in x86_64-pc-windows-msvc aarch64-apple-darwin x86_64-apple-darwin; do
            candidate="candidates/KeepAny-desktop-$target"
            KEEPANY_DESKTOP_TARGET="$target" node scripts/verify-desktop-candidate.mjs "$candidate"
            cp "$candidate"/KeepAny_0.1.1_* release-assets/
          done
          cd release-assets
          sha256sum -c <<'SUMS'
          bfd93f3a6faec26648ed01154163a6f516eefb72021bd48432562fdf3e6fa5c1  KeepAny_0.1.1_x64-setup.exe
          ab79febaa1407d1c28786808fdaa177e813aaf76e735ee75dc463ae4be91cfc8  KeepAny_0.1.1_x64.exe
          3d39d70989074ea5722ab37dbd18aabd6c41ff0a96a90f4b417b2a5cd2831a36  KeepAny_0.1.1_aarch64.dmg
          0466844e6824960a337dc38c4bd9871d73b94be072b0942e341543d4dce842d3  KeepAny_0.1.1_x64.dmg
          SUMS
      - name: Verify and gather third-party license materials
        run: bash scripts/prepare-desktop-preview-licenses.sh
      - name: Save the exact files for publication
        run: |
          cd release-assets
          sha256sum KeepAny_0.1.1_* KeepAny-desktop-licenses.zip > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: prepared-desktop-preview
          path: release-assets/
          if-no-files-found: error

  publish:
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: prepared-desktop-preview
          path: release-assets
      - name: Upload draft, verify remote bytes, and publish prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          (cd release-assets && sha256sum -c SHA256SUMS.txt)
          grep -F '尚未通过 Apple 公证' release/desktop-preview-0.1.1.md
          if gh release view "$KEEPANY_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo 'Release already exists. Inspect it before making any further changes.' >&2
            exit 1
          fi
          existing_tag=$(git ls-remote "https://github.com/$GITHUB_REPOSITORY.git" "refs/tags/$KEEPANY_TAG")
          test -z "$existing_tag"
          gh release create "$KEEPANY_TAG" --repo "$GITHUB_REPOSITORY" --target "$KEEPANY_EXPECTED_COMMIT" \
            --draft --prerelease --latest=false --title 'KeepAny 0.1.1 桌面预览版 / Desktop Preview' \
            --notes-file release/desktop-preview-0.1.1.md release-assets/*
          gh release download "$KEEPANY_TAG" --repo "$GITHUB_REPOSITORY" --dir verify-upload
          diff <(cd release-assets && ls -1) <(cd verify-upload && ls -1)
          cmp release-assets/SHA256SUMS.txt verify-upload/SHA256SUMS.txt
          (cd verify-upload && sha256sum -c SHA256SUMS.txt)
          gh release edit "$KEEPANY_TAG" --repo "$GITHUB_REPOSITORY" --draft=false --prerelease --latest=false
          gh release view "$KEEPANY_TAG" --repo "$GITHUB_REPOSITORY" --json url,isDraft,isPrerelease,targetCommitish
