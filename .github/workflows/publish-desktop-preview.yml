name: Publish KeepAny desktop preview 2026-11-07

on:
  push:
    branches: [codex/desktop-release-acceptance]
    paths:
      - '.github/workflows/publish-desktop-preview.yml'
      - 'scripts/prepare-desktop-preview-licenses.sh'
      - 'release/desktop-preview-20261107.md'

permissions:
  actions: read
  contents: read

concurrency:
  group: keepany-desktop-preview-20261107
  cancel-in-progress: false

env:
  KEEPANY_EXPECTED_COMMIT: 130a368f50bc1e069da1351b602c9c7e608e8862
  KEEPANY_BUILD_RUN: '42346276575'
  KEEPANY_TAG: v0.1.0-desktop-preview.20261107

jobs:
  prepare:
    if: github.repository == 'Syndred/KeepAny'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: 130a368f50bc1e069da1351b602c9c7e608e8862
          path: preview-source
          persist-credentials: false
      - name: Verify original build and acceptance
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          build=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$KEEPANY_BUILD_RUN" --jq '[.head_sha,.path,.conclusion] | join("|")')
          test "$build" = "$KEEPANY_EXPECTED_COMMIT|.github/workflows/desktop.yml|success"
          acceptance=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/42349295899" --jq '[.head_sha,.path,.conclusion] | join("|")')
          test "$acceptance" = '10ccf0403f94b52e0fc594ec35d7655e0526c0ec|.github/workflows/desktop-acceptance.yml|success'
          test "$(git -C preview-source rev-parse HEAD)" = "$KEEPANY_EXPECTED_COMMIT"
      - uses: actions/download-artifact@v4
        with:
          pattern: KeepAny-desktop-*
          github-token: ${{ github.token }}
          run-id: ${{ env.KEEPANY_BUILD_RUN }}
          path: candidates
      - name: Stage exactly the accepted binaries
        run: |
          mkdir -p release-assets
          for target in x86_64-pc-windows-msvc aarch64-apple-darwin x86_64-apple-darwin; do
            candidate="candidates/KeepAny-desktop-$target"
            KEEPANY_DESKTOP_TARGET="$target" node scripts/verify-desktop-candidate.mjs "$candidate"
            cp "$candidate"/KeepAny_0.1.0_* release-assets/
          done
          cd release-assets
          sha256sum -c <<'SUMS'
          b8cdb83d693a48f4457dc69aea22549cc4b8220bb6d3a9f36b40fe850cc4c668  KeepAny_0.1.0_x64-setup.exe
          7ec74d685e5c36c975dd3731d150081f25297872090906dbce6c6f18f5209a63  KeepAny_0.1.0_x64.exe
          6ffca2098f5af1b1a55f27c9e1320e71aafa57b8b3a9852ce5174c8c4c48a2f3  KeepAny_0.1.0_aarch64.dmg
          75663853035196438f2a650febf1f5e8129ed026d576420e1660d248441874af  KeepAny_0.1.0_x64.dmg
          SUMS
      - name: Verify and gather third-party license materials
        run: bash scripts/prepare-desktop-preview-licenses.sh
      - name: Save the exact files for publication
        run: |
          cd release-assets
          sha256sum KeepAny_0.1.0_* KeepAny-desktop-licenses.zip > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: prepared-desktop-preview
          path: release-assets/
          if-no-files-found: error

  publish:
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: prepared-desktop-preview
          path: release-assets
      - name: Upload draft, verify remote bytes, and publish prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          (cd release-assets && sha256sum -c SHA256SUMS.txt)
          grep -F '尚未通过 Apple 公证' release/desktop-preview-20261107.md
          if gh release view "$KEEPANY_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo 'Release already exists. Inspect it before making any further changes.' >&2
            exit 1
          fi
          test -z "$(git ls-remote "https://github.com/$GITHUB_REPOSITORY.git" "refs/tags/$KEEPANY_TAG")"
          gh release create "$KEEPANY_TAG" --repo "$GITHUB_REPOSITORY" --target "$KEEPANY_EXPECTED_COMMIT" \
            --draft --prerelease --latest=false --title 'KeepAny 0.1.0 桌面预览版 / Desktop Preview' \
            --notes-file release/desktop-preview-20261107.md release-assets/*
          gh release download "$KEEPANY_TAG" --repo "$GITHUB_REPOSITORY" --dir verify-upload
          cmp release-assets/SHA256SUMS.txt verify-upload/SHA256SUMS.txt
          (cd verify-upload && sha256sum -c SHA256SUMS.txt)
          gh release edit "$KEEPANY_TAG" --repo "$GITHUB_REPOSITORY" --draft=false --prerelease --latest=false
          gh release view "$KEEPANY_TAG" --repo "$GITHUB_REPOSITORY" --json url,isDraft,isPrerelease,targetCommitish
