name: Publish public documentation

on:
  push:
    branches: [main]
    paths: ['apps/public-site/desktop-preview.json']
  workflow_dispatch:
    inputs:
      verified_release_commit:
        description: 'Optional full SHA of a passed release when only public documentation changed'
        required: false
        type: string

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: public-documentation
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Verify the published desktop downloads or require successful full release checks
        uses: actions/github-script@v7
        env:
          VERIFIED_RELEASE_COMMIT: ${{ inputs.verified_release_commit }}
        with:
          script: |
            if (context.eventName === 'push') {
              const { owner, repo } = context.repo;
              const { data: comparison } = await github.rest.repos.compareCommitsWithBasehead({
                owner, repo, basehead: `${context.payload.before}...${context.sha}`
              });
              const allowed = new Set([
                'README.md', 'README.en.md', 'docs/08-项目进度交接.md', 'docs/试用指南.md',
                'apps/public-site/desktop-preview.json', 'apps/public-site/page.tsx',
                'apps/public-site/page.test.ts', 'scripts/build-public-site.mjs',
                '.github/workflows/public-site.yml'
              ]);
              const manifestPath = 'apps/public-site/desktop-preview.json';
              if (context.payload.forced || comparison.status !== 'ahead' ||
                  !Array.isArray(comparison.files) || comparison.files.length >= 300 ||
                  !comparison.files.some(file => file.filename === manifestPath && ['added', 'modified'].includes(file.status)) ||
                  comparison.files.some(file => !allowed.has(file.filename) || file.previous_filename)) {
                throw new Error('Published desktop download updates must contain only the scoped public documentation changes.');
              }
              const fs = require('node:fs');
              const preview = JSON.parse(fs.readFileSync(manifestPath, 'utf8'));
              const { data: release } = await github.rest.repos.getReleaseByTag({ owner, repo, tag: preview.tag });
              if (release.draft || !release.prerelease || !release.published_at || release.tag_name !== preview.tag) {
                throw new Error('The desktop preview must be a public GitHub prerelease.');
              }
              const [windows, appleSilicon, intel] = [preview.assets.windows, preview.assets.macAppleSilicon, preview.assets.macIntel];
              if (!windows.endsWith('-setup.exe') || !appleSilicon.endsWith('_aarch64.dmg') ||
                  !intel.endsWith('_x64.dmg') || new Set([windows, appleSilicon, intel]).size !== 3) {
                throw new Error('Expected Windows x64, Apple Silicon and Intel installers.');
              }
              const base = `https://github.com/${owner}/${repo}/releases/download/${preview.tag}/`;
              for (const name of [windows, appleSilicon, intel]) {
                const asset = release.assets.find(item => item.name === name && item.state === 'uploaded');
                if (!asset || asset.browser_download_url !== base + name || asset.size <= 0 ||
                    !/^sha256:[a-f0-9]{64}$/.test(asset.digest ?? '')) {
                  throw new Error(`Desktop installer unavailable or missing a published checksum: ${name}`);
                }
              }
              core.info(`Verified the three public installer assets for ${preview.tag}; publishing documentation only.`);
              return;
            }
            const verifiedSha = process.env.VERIFIED_RELEASE_COMMIT || context.sha;
            if (!/^[a-f0-9]{40}$/.test(verifiedSha)) {
              throw new Error('The verified release must be a full commit SHA.');
            }
            if (verifiedSha !== context.sha) {
              const { data: comparison } = await github.rest.repos.compareCommitsWithBasehead({
                owner: context.repo.owner, repo: context.repo.repo,
                basehead: `${verifiedSha}...${context.sha}`
              });
              if (!['ahead', 'identical'].includes(comparison.status) ||
                  !Array.isArray(comparison.files) || comparison.files.length >= 300) {
                throw new Error('The deployment must descend from the verified release with a complete small diff.');
              }
              const publicDocumentation = path => [
                'README.md', 'README.en.md', 'docs/试用指南.md',
                'docs/08-项目进度交接.md', 'scripts/build-public-site.mjs',
                '.github/workflows/public-site.yml'
              ].includes(path) || path.startsWith('apps/public-site/');
              const disallowed = comparison.files.filter(file =>
                !publicDocumentation(file.filename) ||
                (file.previous_filename && !publicDocumentation(file.previous_filename)));
              if (disallowed.length) {
                throw new Error(`Product changes require new release checks: ${disallowed.map(file => file.filename).join(', ')}`);
              }
              core.info(`Reusing product checks from ${verifiedSha}; only ${comparison.files.length} public documentation files changed.`);
            }
            const { pathToFileURL } = require('node:url');
            const { requireFullRelease } = await import(pathToFileURL(
              process.env.GITHUB_WORKSPACE + '/scripts/require-full-release.mjs').href);
            await requireFullRelease({ github, owner: context.repo.owner, repo: context.repo.repo, sha: verifiedSha });
      - uses: pnpm/action-setup@v4
        with:
          version: 11.10.0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec vitest run apps/public-site/page.test.ts
      - run: pnpm build:public-site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist/public-site
      - name: Deploy public documentation
        id: deployment
        uses: actions/deploy-pages@v4
