// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
    
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.13.0'
        classpath 'com.google.gms:google-services:4.4.4'

        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
    }
}

apply from: "variables.gradle"

// The SDK publishes API 37 as the explicit 37.0 platform. All Capacitor library
// projects inherit the same compile SDK without patching installed dependencies.
subprojects { child ->
    ['com.android.application', 'com.android.library'].each { pluginId ->
        child.plugins.withId(pluginId) {
            child.extensions.configure('android') { extension ->
                extension.compileSdkMinor = rootProject.ext.compileSdkMinorVersion
            }
        }
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}
