services:
  postgres:
    image: postgres:17.11-alpine3.24
    environment:
      POSTGRES_DB: keepany
      POSTGRES_USER: keepany
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes:
      - keepany_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keepany -d keepany"]
      interval: 5s
      timeout: 3s
      retries: 20
  sync-server:
    build:
      context: ../..
      dockerfile: apps/sync-server/Dockerfile
    environment:
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL with the db host and URL-encoded password}
      KEEPANY_SYNC_TOKEN: ${KEEPANY_SYNC_TOKEN:?Set KEEPANY_SYNC_TOKEN}
      HOST: 0.0.0.0
      PORT: 8787
    command: ["sh", "-c", "node apps/sync-server/dist/main.js migrate && node apps/sync-server/dist/main.js"]
    ports:
      - "127.0.0.1:8787:8787"
    depends_on:
      postgres:
        condition: service_healthy
volumes:
  keepany_postgres:
